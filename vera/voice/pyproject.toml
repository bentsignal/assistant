[project]
name = "vera-voice"
version = "2.0.0"
description = "Vera's local TTS service: Qwen3-TTS (GPU) or Kokoro (CPU), calm voices, gentle reverb, streamed f32 PCM over HTTP."
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.11.0",
  "torchaudio==2.11.0",
  "faster-qwen3-tts==0.5.4",
  "transformers==5.15.1",
  "kokoro-onnx==0.6.1",
  "numpy>=2",
  "scipy>=1.13",
  "soundfile>=0.12",
  "pyloudnorm>=0.1.1",
  "sounddevice>=0.5",
]

[project.scripts]
vera-voice = "vera_voice.__main__:main"

[project.gui-scripts]
vera-voice-hidden = "vera_voice.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vera_voice"]

[tool.uv]
environments = ["sys_platform == 'win32'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
